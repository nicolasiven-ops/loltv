<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LoLTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --topbar: 44px;    /* muss zu TOPBAR in main.js passen */
    --bottombar: 56px; /* muss zu BOTTOMBAR in main.js passen */
    --bg: #0a0d13;
    --bar: #10141c;
    --line: rgba(255, 255, 255, 0.08);
    --gold: #c8a45c;
    --dim: #8b94a5;
    --text: #e8eaf0;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    user-select: none;
  }

  /* ---------- Titelleiste ---------- */
  #topbar {
    height: var(--topbar); flex-shrink: 0;
    display: flex; align-items: center;
    background: var(--bar); border-bottom: 1px solid var(--line);
    -webkit-app-region: drag; /* Fenster am Balken verschiebbar */
  }
  #wordmark {
    padding: 0 18px;
    font-size: 15px; font-weight: 800; letter-spacing: 5px; color: var(--gold);
  }
  #embed-status { font-size: 12px; color: var(--dim); letter-spacing: 0.4px; }
  #winbtns { margin-left: auto; display: flex; height: 100%; -webkit-app-region: no-drag; }
  #winbtns button {
    width: 46px; height: 100%; border: none; background: transparent;
    color: var(--dim); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #winbtns button:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
  #btn-close:hover { background: #c0392b !important; color: #fff !important; }

  /* ---------- Bühne (hier liegt das eingebettete Spielfenster) ---------- */
  #stage {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(700px 420px at 50% 42%, #101826 0%, transparent 70%),
      var(--bg);
  }
  #stage-hint { text-align: center; }
  #stage-hint .mark {
    font-size: 34px; font-weight: 800; letter-spacing: 12px; color: rgba(200, 164, 92, 0.5);
    margin-bottom: 14px;
  }
  #stage-hint .msg { font-size: 14px; color: var(--dim); line-height: 1.7; }

  /* ---------- Playback-Leiste ---------- */
  #bottombar {
    height: var(--bottombar); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    background: var(--bar); border-top: 1px solid var(--line);
  }
  #bottombar.disabled { opacity: 0.45; pointer-events: none; }

  #btn-play {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05);
    color: var(--text); font-size: 15px; cursor: pointer;
  }
  #btn-play:hover { border-color: var(--gold); color: var(--gold); }

  .clock { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }

  #seek {
    flex: 1; -webkit-appearance: none; height: 5px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.14); outline: none; cursor: pointer;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--gold); border: none;
  }

  #speeds { display: flex; gap: 5px; }
  #speeds button {
    min-width: 40px; padding: 6px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: transparent;
    color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  #speeds button:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.25); }
  #speeds button.active { color: var(--gold); border-color: var(--gold); }

  #hotkey-hint { font-size: 11px; color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>
  <div id="topbar">
    <div id="wordmark">LOLTV</div>
    <div id="embed-status">Warte auf Replay-Client …</div>
    <div id="winbtns">
      <button id="btn-min" title="Minimieren">─</button>
      <button id="btn-max" title="Maximieren">☐</button>
      <button id="btn-close" title="Schließen">✕</button>
    </div>
  </div>

  <div id="stage">
    <div id="stage-hint">
      <div class="mark">LOLTV</div>
      <div class="msg">
        Replay im League-Client starten —<br>
        das Spielfenster wird automatisch hier eingebettet.
      </div>
    </div>
  </div>

  <div id="bottombar" class="disabled">
    <button id="btn-play" title="Play/Pause">⏸</button>
    <div class="clock" id="time-now">0:00</div>
    <input id="seek" type="range" min="0" max="1" step="1" value="0">
    <div class="clock" id="time-len">0:00</div>
    <div id="speeds">
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
      <button data-speed="8">8×</button>
    </div>
    <div id="hotkey-hint">Strg+F12 · HUD an/aus</div>
  </div>

  <script src="studio.js"></script>
</body>
</html>
